name: tests

on:
  push:
  pull_request:

jobs:
  offline:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - name: Verify installed wheel outside the checkout
        env:
          EXP2CPFE_WHEEL_DIR: dist
        run: python -m pytest -q tests/integration/test_installed_wheel.py

  cpu-training:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install "torch>=2.6" --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e ".[dev,training]"
      - name: Require CPU training dependencies
        run: python -c "import torch; assert torch.version.cuda is None; print(torch.__version__)"
      - name: Build collections and exercise real optimization and checkpoint readback
        run: python -m pytest -q tests/unit/test_training_dataset.py tests/unit/test_training_specimens.py tests/unit/test_gh4169_example.py tests/unit/test_surrogate_training.py tests/integration/test_training_dataset_pipeline.py
