name: tests

on:
  push:
  pull_request:

jobs:
  offline:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
      - run: python -m build
      - name: Verify installed wheel outside the checkout
        env:
          EXP2CPFE_WHEEL_DIR: dist
        run: python -m pytest -q tests/integration/test_installed_wheel.py
